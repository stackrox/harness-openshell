version: 1
name: acs-jira-issue-readonly

# Local proof of the ACS repository-owned workflow shape. The ACS checkout is
# supplied as payloads from ACS_TRIAGE_AGENT_DIR; Harness does not own the
# Jira prompt, team map, or output schema.
inference:
  route: inference.local
  provider: vertex-claude-haiku
  model: claude-haiku-4-5@20251001

sandbox:
  # This published image carries the repository's baseline policy at
  # /etc/openshell/policy.yaml. This proof intentionally does not override it.
  image: quay.io/rcochran/openshell@sha256:eda3ebb4a6a44de3715016cf912840f98f378083690f0c0c56f459b44b0dbdc8
  # The atlassian provider contributes the credential proxy and its network
  # endpoints. Its bootstrap profile must cover the host in JIRA_URL.
  providers: [atlassian]
  env:
    JIRA_URL: ${JIRA_URL}
    JIRA_USERNAME: ${JIRA_EMAIL}
    CONFLUENCE_URL: https://redhat.atlassian.net/wiki
    CONFLUENCE_USERNAME: ${JIRA_EMAIL}
    READ_ONLY_MODE: "true"

payloads:
  # These three files are owned by ../acs-triage-agent.
  - source: ${ACS_TRIAGE_AGENT_DIR}/.claude/agents/jira-issue-triager.md
    destination: /sandbox/acs/.claude/agents/jira-issue-triager.md
  - source: ${ACS_TRIAGE_AGENT_DIR}/.claude/teams.yaml
    destination: /sandbox/acs/.claude/teams.yaml
  - source: ${ACS_TRIAGE_AGENT_DIR}/schemas/jira-triage.schema.json
    destination: /sandbox/acs/schemas/jira-triage.schema.json

  # Keep the first proof read-only and limited to the Atlassian tools needed by
  # jira-issue-triager. The provider supplies the credential; this workflow
  # contains no JIRA_API_TOKEN.
  - content: |
      {
        "mcpServers": {
          "mcp-atlassian": {
            "command": "/sandbox/.venv/bin/mcp-atlassian",
            "args": [],
            "env": {
              "JIRA_URL": "${JIRA_URL}",
              "JIRA_USERNAME": "${JIRA_EMAIL}",
              "CONFLUENCE_URL": "https://redhat.atlassian.net/wiki",
              "CONFLUENCE_USERNAME": "${JIRA_EMAIL}",
              "READ_ONLY_MODE": "true"
            },
            "allowedTools": [
              "jira_get_issue"
            ]
          }
        }
      }
    destination: /sandbox/.mcp.json
  - content: |
      {
        "permissions": {
          "allow": [
            "Read(*)",
            "Glob(*)",
            "Grep(*)",
            "Write(/sandbox/artifacts/*)",
            "mcp__mcp-atlassian__jira_get_issue"
          ],
          "deny": [
            "Edit(*)",
            "Bash(*)",
            "mcp__mcp-atlassian__jira_update_issue",
            "mcp__mcp-atlassian__jira_create_issue",
            "mcp__mcp-atlassian__jira_add_comment",
            "mcp__mcp-atlassian__jira_transition_issue",
            "mcp__mcp-atlassian__jira_delete_issue"
          ]
        },
        "enableAllProjectMcpServers": true,
        "trustedMcpServers": ["mcp-atlassian"]
      }
    destination: /sandbox/.claude/settings.json
  - content: |
      {
        "issue_key": "${JIRA_ISSUE_KEY}",
        "task": "Read exactly this one JIRA issue in read-only mode and write one schema-compliant triage result. Do not update, transition, create, or comment on anything."
      }
    destination: /sandbox/task.json
  - content: placeholder
    destination: /sandbox/artifacts/.keep

outputs:
  - source: /sandbox/artifacts/jira-triage.json
    destination: artifacts/jira-triage.json

agent:
  type: claude
  args:
    - --print
    - --model
    - haiku
    - --permission-mode
    - dontAsk
    - >-
      Read /sandbox/task.json, then follow the repository-owned instructions in
      /sandbox/acs/.claude/agents/jira-issue-triager.md. Use
      /sandbox/acs/.claude/teams.yaml as the canonical team list and
      /sandbox/acs/schemas/jira-triage.schema.json as the output contract.
      Query only the issue_key from /sandbox/task.json with the read-only
      Atlassian MCP tools. Write the single result object inside a JSON document
      with timestamp and issues fields to
      /sandbox/artifacts/jira-triage.json. Do not perform any write operation.
