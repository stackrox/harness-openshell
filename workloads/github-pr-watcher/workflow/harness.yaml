version: 1
name: github-pr-watcher
inference:
  route: inference.local
  provider: vertex-review
  model: gemini-2.5-pro
sandbox:
  image: ghcr.io/nvidia/openshell-community/sandboxes/base@sha256:aeef1c63f00e2913ea002ccb3aaf925f338b5c5d70e63576f0d95c16a138044e
  policy:
    file: ${REVIEW_POLICY}
  providers: [github-pr-watcher]
  env:
    OPENCODE_CONFIG: /sandbox/opencode.json
    OPENCODE_VERTEX_API_KEY: sk-openshell-proxy-managed
    REVIEW_REPOSITORY: ${REVIEW_REPOSITORY}
    REVIEW_PR: ${REVIEW_PR}
    REVIEW_HEAD_REF: ${REVIEW_HEAD_REF}
payloads:
  - source: opencode.json
    destination: /sandbox/opencode.json
  - source: skills/pr-watcher/SKILL.md
    destination: /sandbox/skills/pr-watcher/SKILL.md
source:
  repo: https://github.com/${REVIEW_REPOSITORY}.git
  ref: ${REVIEW_HEAD_REF}
  destination: /sandbox/repo
agent:
  type: opencode
  args:
    - run
    - --format
    - json
    - --model
    - vertex/gemini-2.5-pro
    - --agent
    - fixer
    - Read the current pull request comments, propose a safe fix when requested, and push only the resulting fix to the existing PR branch.
