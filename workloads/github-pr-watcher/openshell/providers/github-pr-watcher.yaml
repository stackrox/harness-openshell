# Endpointless provider profile for the PR comment watcher.
# The matching provider instance is named github-pr-watcher. The workload
# policy binds it to one repository and pull request; no credential is stored
# here.
id: github-pr-watcher
display_name: GitHub pull-request watcher
description: GitHub token bound by the PR watcher policy
category: source_control
credentials:
  - name: api_token
    description: GitHub API token
    env_vars: [GITHUB_TOKEN, GH_TOKEN]
    required: true
    auth_style: bearer
    header_name: authorization
discovery:
  credentials: [api_token]
binaries:
  - /usr/bin/gh
  - /usr/local/bin/gh
  - /usr/bin/git
  - /usr/local/bin/git
  - /usr/bin/opencode
