version: 1

# Render ${REVIEW_REPOSITORY}, ${REVIEW_ISSUE}, and ${REVIEW_BASE_REF} before
# applying. The workload can read one labeled issue, push a new branch, create
# one pull request, and add one issue comment. It cannot merge or edit labels.
filesystem_policy:
  include_workdir: true
  read_only:
    - /usr
    - /lib
    - /lib64
    - /bin
    - /etc
    - /proc
    - /dev/urandom
  read_write:
    - /sandbox
    - /tmp
    - /dev/null
landlock:
  compatibility: best_effort
process:
  run_as_user: sandbox
  run_as_group: sandbox
network_policies:
  github_api:
    name: github-api
    endpoints:
      - host: api.github.com
        port: 443
        protocol: rest
        tls: terminate
        enforcement: enforce
        credential_binding:
          provider: github-issue-to-pr
        rules:
          - allow:
              method: GET
              path: /repos/${REVIEW_REPOSITORY}/issues/${REVIEW_ISSUE}
          - allow:
              method: GET
              path: /repos/${REVIEW_REPOSITORY}/issues/${REVIEW_ISSUE}/comments
          - allow:
              method: POST
              path: /repos/${REVIEW_REPOSITORY}/issues/${REVIEW_ISSUE}/comments
          - allow:
              method: POST
              path: /repos/${REVIEW_REPOSITORY}/pulls
    binaries:
      - { path: /usr/bin/gh }
      - { path: /usr/local/bin/gh }
      - { path: /usr/bin/opencode }
  github_git:
    name: github-git
    endpoints:
      - host: github.com
        port: 443
        protocol: rest
        tls: terminate
        enforcement: enforce
        credential_binding:
          provider: github-issue-to-pr
        rules:
          - allow:
              method: GET
              path: /${REVIEW_REPOSITORY}/info/refs*
          - allow:
              method: POST
              path: /${REVIEW_REPOSITORY}/git-upload-pack
          - allow:
              method: POST
              path: /${REVIEW_REPOSITORY}.git/git-upload-pack
          - allow:
              method: POST
              path: /${REVIEW_REPOSITORY}/git-receive-pack
          - allow:
              method: POST
              path: /${REVIEW_REPOSITORY}.git/git-receive-pack
    binaries:
      - { path: /usr/bin/git }
      - { path: /usr/local/bin/git }
      - { path: /usr/bin/opencode }
