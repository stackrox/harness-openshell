version: 1
name: repository-triage-readonly
inference:
  route: inference.local
  provider: vertex-review
  model: gemini-2.5-pro
sandbox:
  image: quay.io/rcochran/openshell@sha256:eda3ebb4a6a44de3715016cf912840f98f378083690f0c0c56f459b44b0dbdc8
  policy:
    file: ${TRIAGE_POLICY}
  providers: [github-readonly, atlassian-readonly]
  env:
    JIRA_URL: ${JIRA_URL}
    JIRA_USERNAME: ${JIRA_USERNAME}
    TRIAGE_REPOSITORY: ${TRIAGE_REPOSITORY}
    TRIAGE_ISSUE: ${TRIAGE_ISSUE}
    OPENCODE_VERTEX_API_KEY: sk-openshell-proxy-managed
payloads:
  - source: mcp.json
    destination: /sandbox/.mcp.json
  - source: settings.json
    destination: /sandbox/.claude/settings.json
  - source: task.json
    destination: /sandbox/task.json
  - source: skills/triage/SKILL.md
    destination: /sandbox/skills/triage/SKILL.md
  - source: triage-report.schema.json
    destination: /sandbox/triage-report.schema.json
source:
  repo: https://github.com/${TRIAGE_REPOSITORY}.git
  ref: ${TRIAGE_REF}
  destination: /sandbox/repo
outputs:
  - source: /sandbox/artifacts/triage-report.json
    destination: triage-report.json
agent:
  type: claude
  args:
    - --print
    - --model
    - haiku
    - --permission-mode
    - dontAsk
    - >-
      Read /sandbox/task.json and follow /sandbox/skills/triage/SKILL.md.
      Inspect the repository, GitHub CI/docs, and the selected Jira issue using
      only the read-only tools and endpoints. Write one valid report to
      /sandbox/artifacts/triage-report.json and do not modify any other file.
