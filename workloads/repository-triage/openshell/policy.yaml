version: 1

# Render the TRIAGE_* values before applying. This is a read-only policy:
# GitHub has no POST/PUT/PATCH/DELETE routes, Git Smart HTTP has no receive-pack,
# and Jira permits GET plus search POST only.
filesystem_policy:
  include_workdir: true
  read_only:
    - /usr
    - /lib
    - /lib64
    - /bin
    - /etc
    - /proc
    - /sandbox/repo
    - /dev/urandom
  read_write:
    - /sandbox/artifacts
    - /tmp
    - /dev/null
landlock:
  compatibility: best_effort
process:
  run_as_user: sandbox
  run_as_group: sandbox
network_policies:
  github_readonly:
    name: github-readonly
    endpoints:
      - host: api.github.com
        port: 443
        protocol: rest
        tls: terminate
        enforcement: enforce
        credential_binding:
          provider: github-readonly
        rules:
          - allow:
              method: GET
              path: /repos/${TRIAGE_REPOSITORY}
          - allow:
              method: GET
              path: /repos/${TRIAGE_REPOSITORY}/contents/**
          - allow:
              method: GET
              path: /repos/${TRIAGE_REPOSITORY}/issues/${TRIAGE_ISSUE}
          - allow:
              method: GET
              path: /repos/${TRIAGE_REPOSITORY}/issues/${TRIAGE_ISSUE}/comments
          - allow:
              method: GET
              path: /repos/${TRIAGE_REPOSITORY}/pulls/**
          - allow:
              method: GET
              path: /repos/${TRIAGE_REPOSITORY}/actions/runs/**
          - allow:
              method: GET
              path: /repos/${TRIAGE_REPOSITORY}/commits/**/check-runs
          - allow:
              method: GET
              path: /repos/${TRIAGE_REPOSITORY}/actions/workflows/**
          - allow:
              method: GET
              path: /repos/${TRIAGE_REPOSITORY}/commits/**
    binaries:
      - { path: /usr/bin/gh }
      - { path: /usr/local/bin/gh }
      - { path: /usr/bin/curl }
  github_git_readonly:
    name: github-git-readonly
    endpoints:
      - host: github.com
        port: 443
        protocol: rest
        tls: terminate
        enforcement: enforce
        credential_binding:
          provider: github-readonly
        rules:
          - allow:
              method: GET
              path: /${TRIAGE_REPOSITORY}/info/refs*
          - allow:
              method: POST
              path: /${TRIAGE_REPOSITORY}/git-upload-pack
          - allow:
              method: POST
              path: /${TRIAGE_REPOSITORY}.git/git-upload-pack
    binaries:
      - { path: /usr/bin/git }
      - { path: /usr/local/bin/git }
  jira_readonly:
    name: jira-readonly
    endpoints:
      - host: issues.redhat.com
        port: 443
        protocol: rest
        tls: terminate
        enforcement: enforce
        rules:
          - allow:
              method: GET
              path: /rest/api/2/**
          - allow:
              method: GET
              path: /rest/api/3/**
          - allow:
              method: POST
              path: /rest/api/2/search
          - allow:
              method: POST
              path: /rest/api/3/search
    binaries:
      - { path: /sandbox/.venv/bin/mcp-atlassian }
      - { path: /sandbox/.venv/bin/python }
