# Endpointless GitHub provider for read-only repository triage.
# The workload policy supplies the concrete repository endpoint bindings.
id: github-readonly
display_name: GitHub read-only triage
description: GitHub token bound by the repository-triage policy
category: source_control
credentials:
  - name: api_token
    description: GitHub API token
    env_vars: [GITHUB_TOKEN, GH_TOKEN]
    required: true
    auth_style: bearer
    header_name: authorization
discovery:
  credentials: [api_token]
binaries:
  - /usr/bin/gh
  - /usr/local/bin/gh
  - /usr/bin/git
  - /usr/local/bin/git
  - /usr/bin/curl
