apiVersion: harness.openshell.dev/v1alpha1
kind: Harness
metadata:
    name: with-providers-test
spec:
    target:
        gateway: rc-dev
    providers:
        - name: github-fact
          management: referenced
        - name: gcp-vertex
          management: referenced
    agent:
        type: claude
    source:
        repo: https://github.com/example/repo
        ref: main
