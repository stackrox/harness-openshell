apiVersion: harness.openshell.dev/v1alpha1
kind: Harness
metadata:
    name: with-payloads-test
spec:
    target: {}
    agent:
        type: claude
    source:
        repo: https://github.com/example/repo
        ref: main
    payloads:
        - content: |
            # Configuration file
            key: value
          destination: /sandbox/config
        - source: scripts/setup.sh
          destination: /sandbox/script.sh
