apiVersion: harness.openshell.dev/v1alpha1
kind: Harness
metadata:
    name: sandbox-fields-test
spec:
    target:
        gateway: rc-dev
    sandbox:
        image: quay.io/example/sandbox:latest
        policy:
            file: .harness/policies/dev.yaml
        env:
            RUST_BACKTRACE: "1"
        tty: true
    agent:
        type: claude
    source:
        repo: https://github.com/example/repo
        ref: main
