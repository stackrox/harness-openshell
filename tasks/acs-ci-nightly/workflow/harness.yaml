version: 1
name: acs-ci-nightly

inference:
  route: inference.local
  provider: vertex-claude-triage
  model: claude-haiku-4-5@20251001

sandbox:
  image: ${ACS_TRIAGE_IMAGE}
  policy:
    file: ../openshell/policy.yaml
  providers:
    - atlassian-triage-read
    - prow-gcs-read
  env:
    ANTHROPIC_API_KEY: sk-ant-openshell-proxy-managed
    ANTHROPIC_BASE_URL: https://inference.local
    CLAUDE_CODE_DISABLE_EXPERIMENTAL_BETAS: "1"
    JIRA_URL: https://redhat.atlassian.net
    CONFLUENCE_URL: https://redhat.atlassian.net/wiki
    READ_ONLY_MODE: "true"
    TRIAGE_RUN_URL: ${TRIAGE_RUN_URL}
    GCS_BUCKET: test-platform-results-public
    BASH_ENV: /sandbox/.bash_env
    CLOUDSDK_CORE_CUSTOM_CA_CERTS_FILE: /etc/openshell-tls/ca-bundle.pem
    CURL_CA_BUNDLE: /etc/openshell-tls/ca-bundle.pem

source:
  repo: https://github.com/stackrox/acs-triage-agent.git
  ref: ${ACS_TRIAGE_REF}
  destination: /sandbox

payloads:
  - source: CI-NIGHTLY.md
    destination: /sandbox/CI-NIGHTLY.md
  - source: gsutil
    destination: /sandbox/tools/gsutil
  - content: |
      export PATH="/sandbox/tools:$PATH"
      gsutil() { /bin/bash /sandbox/tools/gsutil "$@"; }
      export -f gsutil
      if [ -n "$GCP_SA_ACCESS_TOKEN" ]; then
        export CLOUDSDK_AUTH_ACCESS_TOKEN="$GCP_SA_ACCESS_TOKEN"
      fi
        if ! printenv OPENSHELL_GCS_MANIFEST_STARTED >/dev/null 2>&1; then
          export OPENSHELL_GCS_MANIFEST_STARTED=1
          /bin/bash /sandbox/tools/gsutil collect \
            >/tmp/openshell-nightly-failures.tsv \
            2>/tmp/openshell-nightly-failures.err || {
            echo "collection failed; see /tmp/openshell-nightly-failures.err" \
              >>/tmp/openshell-nightly-failures.tsv
          }
          cp /tmp/openshell-nightly-failures.tsv /sandbox/nightly-failures.tsv 2>/dev/null || true
          cp /tmp/openshell-nightly-failures.err /sandbox/nightly-failures.err 2>/dev/null || true
        fi
    destination: /sandbox/.bash_env

agent:
  type: claude
  args:
    - --dangerously-skip-permissions
    - --print
    - Read /sandbox/CI-NIGHTLY.md and execute the read-only CI nightly task exactly as instructed.

outputs:
  - source: /sandbox/acs-triage-agent/artifacts/ci-triage.json
    destination: ci-triage.json
    required: false
  - source: /sandbox/nightly-failures.tsv
    destination: nightly-failures.tsv
    required: false
  - source: /sandbox/nightly-failures.err
    destination: nightly-failures.err
    required: false
