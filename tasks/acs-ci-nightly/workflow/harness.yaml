version: 1
name: acs-ci-nightly

inference:
  route: inference.local
  provider: vertex-claude-triage
  model: claude-haiku-4-5@20251001

sandbox:
  image: ${ACS_TRIAGE_IMAGE}
  policy:
    file: ../openshell/policy.yaml
  providers:
    - atlassian-triage-read
    - github-triage-read
    - prow-gcs-read
  env:
    ANTHROPIC_API_KEY: sk-ant-openshell-proxy-managed
    ANTHROPIC_BASE_URL: https://inference.local
    CLAUDE_CODE_DISABLE_EXPERIMENTAL_BETAS: "1"
    JIRA_URL: https://redhat.atlassian.net
    CONFLUENCE_URL: https://redhat.atlassian.net/wiki
    READ_ONLY_MODE: "true"
    ACS_OPENSHELL_TASK: "true"
    TRIAGE_RUN_URL: ${TRIAGE_RUN_URL}
    GCS_BUCKET: test-platform-results-public
    BASH_ENV: /sandbox/.bash_env
    CLOUDSDK_CORE_CUSTOM_CA_CERTS_FILE: /etc/openshell-tls/ca-bundle.pem
    CURL_CA_BUNDLE: /etc/openshell-tls/ca-bundle.pem

source:
  repo: https://github.com/stackrox/acs-triage-agent.git
  ref: ${ACS_TRIAGE_REF}
  destination: /sandbox

payloads:
  - content: |
      # OpenShell injects the short-lived provider token; the ACS repository
      # owns the bounded Prow/GCS compatibility command.
      export PATH="/sandbox/scripts:$PATH"
      gsutil() { /bin/bash /sandbox/scripts/gsutil "$@"; }
      export -f gsutil
      if [ -n "$GCP_SA_ACCESS_TOKEN" ]; then
        export CLOUDSDK_AUTH_ACCESS_TOKEN="$GCP_SA_ACCESS_TOKEN"
      fi
    destination: /sandbox/.bash_env

agent:
  type: /bin/bash
  args:
    - -c
    - cd /sandbox/acs-triage-agent && exec ./scripts/run-triage.sh

outputs:
  - source: /sandbox/acs-triage-agent/artifacts/ci-triage.json
    destination: ci-triage.json
    required: false
  - source: /sandbox/acs-triage-agent/artifacts/triage-report.md
    destination: triage-report.md
    required: false
  - source: /sandbox/acs-triage-agent/artifacts/slack-summary.txt
    destination: slack-summary.txt
    required: false
