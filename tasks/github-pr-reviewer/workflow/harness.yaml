version: 1
name: github-pr-review
sandbox:
  image: ghcr.io/nvidia/openshell-community/sandboxes/base@sha256:aeef1c63f00e2913ea002ccb3aaf925f338b5c5d70e63576f0d95c16a138044e
  providers: [vertex-claude-haiku]
payloads:
  - source: REVIEW.md
    destination: /sandbox/REVIEW.md
  - source: fixtures/pr.diff
    destination: /sandbox/pr.diff
agent:
  type: claude
  args:
    - --print
    - Read /sandbox/REVIEW.md and /sandbox/pr.diff. Follow the output contract exactly.
