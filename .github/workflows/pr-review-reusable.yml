name: Harness PR review

on:
  workflow_call:
    inputs:
      harness-ref:
        description: Immutable 40-character Harness commit SHA to execute
        required: true
        type: string
      skill-path:
        description: Review skill relative to the trusted caller checkout
        type: string
        default: ''
      allow-draft-reviews:
        type: boolean
        default: false
      openshell-github-app-client-id:
        description: GitHub App used for host metadata reads and local provider bootstrap
        required: true
        type: string
      execution-target:
        description: local provisions temporary CI resources; managed uses existing resources
        type: string
        default: local
      managed-workflow:
        description: Trusted caller workflow YAML with target registration and existing provider references
        type: string
        default: ''
      runner-label:
        description: Use a trusted runner with gateway and OIDC network access for managed execution
        type: string
        default: ubuntu-latest
      github-provider:
        description: Existing endpointless provider name for managed execution
        type: string
        default: github-review
    secrets:
      VERTEX_AI_SERVICE_ACCOUNT_KEY:
        required: false
      OPENSHELL_GITHUB_APP_PRIVATE_KEY:
        required: true
      OPENSHELL_OIDC_CLIENT_SECRET:
        required: false

permissions:
  contents: read

jobs:
  review:
    if: >-
      (!github.event.pull_request.draft || inputs.allow-draft-reviews) &&
      (((github.event.action == 'labeled' || github.event.action == 'unlabeled') && github.event.label.name == 'ai-review') ||
      (github.event.action != 'labeled' && github.event.action != 'unlabeled' && contains(github.event.pull_request.labels.*.name, 'ai-review')))
    runs-on: ${{ inputs.runner-label }}
    timeout-minutes: 15
    concurrency:
      group: ai-review-${{ github.repository }}-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    env:
      REVIEW_REPOSITORY: ${{ github.repository }}
      REVIEW_PR: ${{ github.event.pull_request.number }}
      REVIEW_HEAD: ${{ github.event.pull_request.head.sha }}
      ALLOW_DRAFT_REVIEWS: ${{ inputs.allow-draft-reviews }}
    steps:
      - name: Validate immutable revision and execution target
        env:
          HARNESS_REF: ${{ inputs.harness-ref }}
          EXECUTION_TARGET: ${{ inputs.execution-target }}
        run: |
          [[ "$HARNESS_REF" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXECUTION_TARGET" == local || "$EXECUTION_TARGET" == managed ]]
      # Only trusted default-branch content runs on the host. PR content is data.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: caller
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: stackrox/harness-openshell
          ref: ${{ inputs.harness-ref }}
          path: harness
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: harness/go.mod
      - name: Build trusted harness
        working-directory: harness
        run: |
          echo "REVIEW_DIR=$RUNNER_TEMP/ai-review-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
          make cli
      - name: Create repository-scoped GitHub App token
        id: openshell-app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ inputs.openshell-github-app-client-id }}
          private-key: ${{ secrets.OPENSHELL_GITHUB_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: read
          permission-pull-requests: ${{ inputs.execution-target == 'local' && 'write' || 'read' }}
      - name: Prepare exact PR input
        id: prepare
        working-directory: harness
        env:
          GH_TOKEN: ${{ steps.openshell-app-token.outputs.token }}
        run: ./harness github review prepare
      - name: Run with temporary local OpenShell resources
        if: steps.prepare.outputs.eligible == 'true' && inputs.execution-target == 'local'
        uses: ./harness/.github/actions/run-local-review
        with:
          github-token: ${{ steps.openshell-app-token.outputs.token }}
          vertex-key: ${{ secrets.VERTEX_AI_SERVICE_ACCOUNT_KEY }}
          vertex-project: ${{ vars.VERTEX_AI_PROJECT_ID }}
          vertex-region: ${{ vars.VERTEX_AI_REGION }}
          skill-path: ${{ inputs.skill-path }}
      - name: Run with existing managed OpenShell resources
        if: steps.prepare.outputs.eligible == 'true' && inputs.execution-target == 'managed'
        working-directory: harness
        env:
          GH_TOKEN: ${{ steps.openshell-app-token.outputs.token }}
          OPENSHELL_OIDC_CLIENT_SECRET: ${{ secrets.OPENSHELL_OIDC_CLIENT_SECRET }}
          MANAGED_WORKFLOW: ${{ inputs.managed-workflow }}
          SKILL_PATH: ${{ inputs.skill-path }}
          GITHUB_PROVIDER: ${{ inputs.github-provider }}
        run: |
          [[ -n "$MANAGED_WORKFLOW" && "$MANAGED_WORKFLOW" != /* && "$MANAGED_WORKFLOW" != *..* ]]
          workflow="$(realpath -e "../caller/$MANAGED_WORKFLOW")"
          [[ "$workflow" == "$(realpath ../caller)/"* ]]
          args=(--file "$workflow" --github-provider "$GITHUB_PROVIDER")
          if [[ -n "$SKILL_PATH" ]]; then args+=(--skill-root ../caller --skill "$SKILL_PATH"); fi
          ./harness github review run "${args[@]}"
      - uses: actions/upload-artifact@v7
        if: always() && steps.prepare.outputs.eligible == 'true'
        with:
          name: ai-review-pr-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}-${{ github.run_attempt }}
          path: ${{ env.REVIEW_DIR }}/
          retention-days: 7
