name: Vertex AI smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vertex-gemini-opencode:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install OpenShell
        run: |
          ver="$(cat .openshell-version)"
          test -n "$ver" || { echo "error: .openshell-version is empty"; exit 1; }
          install_script="$(mktemp)"
          curl -fLsS https://raw.githubusercontent.com/NVIDIA/OpenShell/main/install.sh -o "$install_script"
          OPENSHELL_VERSION="$ver" sh "$install_script"

      - name: Authenticate to Google Cloud
        id: gcp-auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: ${{ vars.VERTEX_AI_PROJECT_ID }}
          credentials_json: ${{ secrets.VERTEX_AI_SERVICE_ACCOUNT_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Wait for gateway
        run: |
          for _ in $(seq 1 30); do
            openshell inference get &>/dev/null && exit 0
            sleep 1
          done
          openshell gateway list || true
          echo "OpenShell gateway did not become ready" >&2
          exit 1

      - name: Run Vertex AI smoke test
        env:
          VERTEX_AI_PROJECT_ID: ${{ vars.VERTEX_AI_PROJECT_ID }}
          VERTEX_AI_REGION: ${{ vars.VERTEX_AI_REGION }}
        run: |
          token="$(gcloud auth print-access-token)"
          echo "::add-mask::$token"
          export GOOGLE_VERTEX_AI_TOKEN="$token"
          make test-vertex-gemini-opencode
