name: Label StackRox AI review pull requests

on:
  pull_request_target:
    types: [opened, synchronize]

permissions:
  contents: read
  issues: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - name: Create OpenShell GitHub App token
        id: openshell-app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.OPENSHELL_GITHUB_APP_CLIENT_ID }}
          private-key: ${{ secrets.OPENSHELL_GITHUB_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-pull-requests: write
      - name: Add StackRox AI review label
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # ratchet:actions/github-script@v9.0.0
        with:
          github-token: ${{ steps.openshell-app-token.outputs.token }}
          script: |
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ['stackrox-ai-review']
            });
