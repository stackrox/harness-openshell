# kind gateway — deploys openshell to a local kind cluster.
#
# Prerequisites:
#   - kind installed and cluster running:
#       kind create cluster --name openshell
#   - kubectl context set to the kind cluster
#
# Uses NodePort + node InternalIP for access (no Ingress controller needed).
# Direct mode: no launcher Job, providers registered from workstation.
# No mTLS: the gateway runs HTTP for local dev simplicity.

gateway:
  type: remote
  platform: k8s
  service: nodeport
  name: openshell-kind
  mode: direct

chart:
  # Keep in lockstep with the openshell CLI version (see openshift.yaml and the
  # OPENSHELL_VERSION pin in .github/workflows/integration.yml). The chart
  # version determines the supervisor image tag; if it lags the CLI, sandbox
  # create fails with "supervisor session not found" during the ssh/tar upload.
  version: "0.0.110"

helm:
  values:
    service:
      type: NodePort
    server:
      disableTls: true
      auth:
        allowUnauthenticatedUsers: true
    pkiInitJob:
      enabled: true
