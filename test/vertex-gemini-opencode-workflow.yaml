version: 1
name: vertex-gemini
inference:
  route: inference.local
  provider: vertex-ci
  model: gemini-2.5-pro
sandbox:
  image: ghcr.io/nvidia/openshell-community/sandboxes/base:latest
  env:
    OPENCODE_CONFIG: /sandbox/opencode-vertex.json
    OPENCODE_VERTEX_API_KEY: openshell-proxy-managed
payloads:
  - destination: /sandbox/opencode-vertex.json
    content: |
      {
        "$schema": "https://opencode.ai/config.json",
        "provider": {
          "vertex": {
            "npm": "@ai-sdk/openai-compatible",
            "name": "Vertex AI through OpenShell",
            "options": {
              "baseURL": "https://inference.local/v1",
              "apiKey": "{env:OPENCODE_VERTEX_API_KEY}"
            },
            "models": {
              "gemini-2.5-pro": {
                "name": "Gemini 2.5 Pro"
              }
            }
          }
        }
      }
agent:
  type: opencode
  args:
    - run
    - --model
    - vertex/gemini-2.5-pro
    - Respond with exactly GEMINI_OPENCODE_OK and nothing else.
