version: 1
name: vertex-gemini
sandbox:
  image: ghcr.io/nvidia/openshell-community/sandboxes/base@sha256:aeef1c63f00e2913ea002ccb3aaf925f338b5c5d70e63576f0d95c16a138044e
  providers: [vertex-ci]
  env:
    OPENCODE_CONFIG: /sandbox/opencode-vertex.json
    VERTEX_AI_BASE_URL: ${VERTEX_AI_BASE_URL}
payloads:
  - destination: /sandbox/opencode-vertex.json
    content: |
      {
        "$schema": "https://opencode.ai/config.json",
        "provider": {
          "vertex": {
            "npm": "@ai-sdk/openai-compatible",
            "name": "Vertex AI through OpenShell",
            "options": {
              "baseURL": "{env:VERTEX_AI_BASE_URL}",
              "apiKey": "{env:GOOGLE_VERTEX_AI_TOKEN}"
            },
            "models": {
              "gemini-2.5-pro": {
                "name": "Gemini 2.5 Pro"
              }
            }
          }
        }
      }
agent:
  type: opencode
  args:
    - run
    - --model
    - vertex/gemini-2.5-pro
    - Respond with exactly GEMINI_OPENCODE_OK and nothing else.
