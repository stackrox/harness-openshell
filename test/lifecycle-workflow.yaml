version: 1
name: sdk-lifecycle
sandbox:
  image: ghcr.io/nvidia/openshell-community/sandboxes/base@sha256:aeef1c63f00e2913ea002ccb3aaf925f338b5c5d70e63576f0d95c16a138044e
  keep: true
  policy:
    file: lifecycle-policy.yaml
  env:
    STATIC_VAR: hello-world
agent:
  type: sh
  args: [-c, "test \"$(cat /sandbox/proof.txt)\" = upload-ok && ! touch /var/tmp/harness-policy-denied && printf 'canonical-sdk-ok\\n'"]
payloads:
  - content: upload-ok
    destination: /sandbox/proof.txt
